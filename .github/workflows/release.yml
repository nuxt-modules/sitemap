name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Force Set pnpm Registry
        run: pnpm config set registry https://registry.npmjs.org

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # A new release becomes the latest GitHub release by default. Hand that back to the
      # newest stable tag.
      - name: Keep the newest major as the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          newest_tag="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -n "$newest_tag" && "$newest_tag" != "$GITHUB_REF_NAME" ]]; then
            gh release edit "$newest_tag" --latest
          fi

      - name: Install Dependencies
        run: pnpm i

      # The v7 line publishes under the `latest-7` dist-tag, so `latest` keeps pointing at the
      # newest major.
      - run: pnpm publish -r --access public --no-git-checks --tag latest-7
